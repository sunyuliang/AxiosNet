# 打 tag（v1.2.3 / v1.2.3-rc.1）时自动构建、测试、打包并发布到 nuget.org。
# 普通 push / PR 只做构建 + 测试（不发布），避免回归只能等到打 tag 才暴露。
# 认证方式：NuGet Trusted Publishing（OIDC），不需要长期 API Key，也不需要 NUGET_API_KEY 密钥。
#
# 发布前置条件：build-test（双 TFM 全量用例）与 aot（win / linux 冒烟 + 包消费 smoke）都成功，
# publish 才会启动；任一失败或取消，两个包都不会被推送——不会出现「发了一半」。
#
# 幂等：每次运行都先探测 nuget.org 上这个版本在不在，在库就只补缺失的符号，不在库才推一次。
# 探测必须容忍摄入延迟——包推成功后公开索引（flat container）最长约 30 分钟才生效，这段窗口里
# 404 不代表「没发布」，重跑撞上 409 也不代表出错。窗口按 30 分钟给，取不到只告警不判失败。
#
# 仓库同时维护两个 NuGet 包：AxiosNet（axios 风格 HTTP 客户端 + 内置声明式 API 客户端，
# 命名空间 AxiosNet.WebAPI）与 AxiosNet.DependencyInjection（两者的 DI 单例注入扩展，依赖主包；
# 主库自身零外部依赖）。
# 两个包用同一 tag 同步发版（monorepo 锁步版本）：publish / verify-published 按 matrix 逐包执行同一套流程，
# 包项目由 matrix.package 注入 PACKAGE_PROJECT，各步骤内的发布状态机逻辑与单包时代逐字不变。
#
# 与 nuget.org「Trusted Publishing」策略必须逐项一致（大小写不敏感，但内容要相同）：
#   Repository Owner : sunyuliang        ← 仓库：https://github.com/sunyuliang/AxiosNet
#   Repository       : AxiosNet
#   Workflow File    : build-nuget.yml   ← 只填文件名，不带 .github/workflows/ 路径
#   Environment      : build-nuget
# 任一不匹配，NuGet/login 会拿不到临时 Key（401/403）。

name: build-nuget

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v[0-9]*'
  pull_request:
  # 手动复核已发布版本（不构建、不发布）：符号摄入慢于发布时，用它事后补验
  workflow_dispatch:
    inputs:
      version:
        description: 要核对的版本号；留空则取 src/AxiosNet/AxiosNet.csproj 的 <Version>
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: build & test
    # 手动复核（workflow_dispatch）只跑 verify-published，不重复构建测试
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      TEST_PROJECTS: |
        test/AxiosNet.Tests/AxiosNet.Tests.csproj        test/AxiosNet.DependencyInjection.Tests/AxiosNet.DependencyInjection.Tests.csproj

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 类库是 net6.0 / net8.0 双目标，测试项目同样双目标（两种运行时各测对应资产），
          # 因此 6.0 运行时必须显式安装（runner 镜像不保证保留已 EOL 的 6.0）
          dotnet-version: |
            8.0.x
            6.0.x

      - name: 还原依赖
        run: |
          for project in $TEST_PROJECTS; do
            dotnet restore "$project"
          done

      - name: 构建
        run: |
          for project in $TEST_PROJECTS; do
            dotnet build "$project" --configuration Release --no-restore
          done

      - name: 运行并发性能用例（独占进程，排在整套用例之前）
        # 这条用例判的是「与 HttpClient 的配对比值」，两侧的编译状态必须可比：HttpClient 在共享框架里是
        # ReadyToRun，进程一起来就是优化代码；AxiosNet 是普通 IL，要先跑 Tier0、再等分层编译换成 Tier1 + PGO。
        # 这层爬坡按时钟推进 —— runner 越慢越忙，固定秒数的预热里换掉的比例越少，测到的就是编译进度而不是
        # 代码能力。用例内部因此按「比值进入稳定带」自适应预热（ConcurrencyPerformanceTests.WarmUpAsync），
        # 分层编译保持默认开启（真机上的稳态性能靠 PGO）。这里只负责给它独占进程、排在整套用例之前并逐 TFM
        # 串行：两个测试进程同时压同一台 runner 会互相抢核，整套用例跑完的机器状态也不对称。
        run: |
          for tfm in net8.0 net6.0; do
            dotnet test test/AxiosNet.Tests/AxiosNet.Tests.csproj \
              --configuration Release \
              --no-build \
              --no-restore \
              -f "$tfm" \
              --filter "FullyQualifiedName~ConcurrencyPerformanceTests" \
              --logger "console;verbosity=normal"
          done

      - name: 运行单元测试（不含并发性能用例）
        # 并发性能用例在上面单独跑过了：它放在整套用例里既会拿机器过载状态当代码退化，也会被整套用例的负载拖慢。
        run: |
          for project in $TEST_PROJECTS; do
            dotnet test "$project" --configuration Release --no-build --no-restore \
              --filter "FullyQualifiedName!~ConcurrencyPerformanceTests" \
              --logger "console;verbosity=normal"
          done

  aot:
    name: native aot (${{ matrix.rid }})
    # AOT 的失败是平台 / 工具链相关的（链接器、系统库、ILC 版本），win 与 linux 都要跑一遍。
    # 两个项目引用形态都覆盖：示例走 ProjectReference，包 smoke 走真正的 NuGet 引用。
    # 依赖 build-test：单测先挂时不必再花几分钟跑 ILC。
    if: github.event_name != 'workflow_dispatch'
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Linux AOT 依赖
        # ILC 在 Linux 上要链原生对象：clang + zlib 头文件。runner 镜像通常自带，显式装一遍免得版本换代后挂得莫名。
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: 还原依赖
        # 带 --runtime：publish 用 --no-restore 时，资产文件必须已经含该 RID 的运行时包，否则 NETSDK1047。
        run: dotnet restore samples/AxiosNet.Aot/AxiosNet.Aot.csproj --runtime ${{ matrix.rid }}

      - name: 发布 AOT 示例（IL2xxx / IL3xxx 视为错误）
        # 示例不再 root 整个程序集：能不能通过完全取决于源生成器烘焙的元数据。
        # 除反射 / 动态代码（IL2026 / IL3050 / IL3051）外，把 DAM 相关的一组也当错误：
        # 本库大量依赖 DynamicallyAccessedMembers + 抑制，这几条最容易只在包消费方发布时暴露。
        run: >
          dotnet publish samples/AxiosNet.Aot/AxiosNet.Aot.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --no-restore
          -p:TrimmerSingleWarn=false
          -p:WarningsAsErrors=IL2026%3BIL3050%3BIL3051%3BIL2070%3BIL2072%3BIL2075%3BIL2087%3BIL2098

      - name: 运行 AOT 示例
        shell: bash
        run: |
          set -euo pipefail
          exe="samples/AxiosNet.Aot/bin/Release/net8.0/${{ matrix.rid }}/publish/AxiosNet.Aot"
          [ -f "$exe" ] || exe="$exe.exe"
          start="$(date +%s)"
          output="$("$exe")"
          elapsed=$(( $(date +%s) - start ))
          printf '%s\n' "$output"
          # 示例逐项打印场景结果；少于 11 行说明有场景提前退出
          [ "$(printf '%s\n' "$output" | wc -l)" -ge 11 ]
          # 体积预算按平台分开：Linux 把 OpenSSL / System.Native / 压缩 / globalization 这些 shim 全部
          # 静态链进可执行文件，Windows 这些走系统 DLL 或预烘焙的 Aot.lib，同一份 IL 平台差约 2 MB。
          # 基线（net8、ILC 8.0.31、Release）：win-x64 8518 KB、linux-x64 10469 KB。
          # 超预算说明又有反射依赖被拉回来，或程序集被整体 root 了。
          case "${{ matrix.rid }}" in
            linux-*) budget=$((11 * 1024 * 1024)) ;;
            *)       budget=$((9 * 1024 * 1024)) ;;
          esac
          size="$(wc -c < "$exe")"
          echo "体积 $((size / 1024)) KB / 预算 $((budget / 1024)) KB / 启动加运行 ${elapsed} s"
          [ "$size" -le "$budget" ]

      - name: 包消费 smoke（只引用 NuGet 包）
        # 与示例互补：示例用 ProjectReference，看不到「包内分析器是否生效」「包内 dll 的 AOT 标注是否正确」。
        shell: bash
        run: bash eng/aot-package-smoke.sh

  publish:
    name: pack & push
    # 只有 tag 推送才发布；普通 push / PR 由上面的 build-test 覆盖
    if: startsWith(github.ref, 'refs/tags/v')
    # 所有测试用例与 AOT 冒烟全过才允许发布：任一失败 / 取消，本 job 直接跳过。
    # 两个前置 job 只在 workflow_dispatch 下被跳过，而 publish 只跑 tag，所以 tag 事件下两者必定真实执行。
    needs: [build-test, aot]
    runs-on: ubuntu-latest
    # 必须与 nuget.org 策略里填的 Environment 完全一致（策略填了就必须匹配）
    environment: build-nuget
    permissions:
      contents: read
      id-token: write # OIDC：换取 nuget.org 短期 API Key 的前提
    # 两包锁步发版：两个包项目各起一个 job，跑同一套（逐字未改的）发布状态机
    strategy:
      fail-fast: false
      matrix:
        package:
          - src/AxiosNet/AxiosNet.csproj
          - src/AxiosNet.DependencyInjection/AxiosNet.DependencyInjection.csproj

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      PACKAGE_PROJECT: ${{ matrix.package }}
      TEST_PROJECTS: |
        test/AxiosNet.Tests/AxiosNet.Tests.csproj        test/AxiosNet.DependencyInjection.Tests/AxiosNet.DependencyInjection.Tests.csproj

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink 需要完整历史来计算 commit

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: 校验 tag 并解析包版本
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          # 允许 1.2.3 与 1.2.3-rc.1（NuGet 语义化版本，不含 build metadata）
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::tag '$tag' 不符合 vMAJOR.MINOR.PATCH[-prerelease]，例如 v1.0.0 / v1.1.0-rc.1"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [[ "$ver" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "解析出版本：$ver（来自 tag $tag，commit ${GITHUB_SHA:0:7}）"

      - name: 发布前探测该版本是否已在库（只读）
        id: preflight
        shell: bash
        # 每次运行都先回答「这个版本在 nuget.org 上到底有没有」：present = 已可拉取（后面只补符号），
        # missing = 取不到。注意 missing 不等于「没发布」：摄入 / 索引最长滞后约 30 分钟，
        # 刚发过的版本在同一窗口里也是 404，所以这里只记录，不据此跳过任何步骤。
        run: |
          set -uo pipefail
          ID="$(basename "$PACKAGE_PROJECT" .csproj)"
          ID_LC="${ID,,}"
          VER="${{ steps.meta.outputs.version }}"
          FLAT="https://api.nuget.org/v3-flatcontainer/${ID_LC}/${VER}/${ID_LC}.${VER}.nupkg"
          code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 "$FLAT")"
          if [ "$code" = "200" ]; then
            echo "state=present" >> "$GITHUB_OUTPUT"
            echo "$ID $VER 已在公开索引可拉取：后续只补推缺失的符号，不再推 nupkg"
          else
            echo "state=missing" >> "$GITHUB_OUTPUT"
            echo "$ID $VER 暂不可拉取（HTTP $code）：可能是首次发布，也可能是刚发过、索引仍在生效（最长约 30 分钟）"
          fi

      - name: 还原依赖
        run: |
          for project in $TEST_PROJECTS; do
            dotnet restore "$project"
          done

      - name: 构建
        run: |
          for project in $TEST_PROJECTS; do
            dotnet build "$project" \
              --configuration Release \
              --no-restore \
              -p:Version="${{ steps.meta.outputs.version }}" \
              -p:ContinuousIntegrationBuild=true
          done

      - name: 运行并发性能用例（独占进程，排在整套用例之前）
        # 与 build-test 同口径：单独一步、排在整套用例之前、逐 TFM 串行；自适应预热在用例内部，
        # 理由见 build-test 同名步骤。
        run: |
          for tfm in net8.0 net6.0; do
            dotnet test test/AxiosNet.Tests/AxiosNet.Tests.csproj \
              --configuration Release \
              --no-build \
              --no-restore \
              -f "$tfm" \
              --filter "FullyQualifiedName~ConcurrencyPerformanceTests" \
              --logger "console;verbosity=normal"
          done

      - name: 运行单元测试（不含并发性能用例）
        run: |
          for project in $TEST_PROJECTS; do
            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --no-restore \
              --filter "FullyQualifiedName!~ConcurrencyPerformanceTests" \
              --logger "console;verbosity=normal"
          done

      - name: 打包 nupkg + snupkg
        run: |
          set -euo pipefail
          # 不用 --no-build：由 pack 自己构建。--no-build 打包在某些 SDK/环境组合下可能不生成
          # snupkg，而符号包缺失在推送端毫无报错（1.0.0 实际中招，详见下方可见性校验）。
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --output artifacts \
            -p:Version="${{ steps.meta.outputs.version }}" \
            -p:ContinuousIntegrationBuild=true
          echo '--- artifacts ---'
          ls -l artifacts
          # 符号包是源码映射（SourceLink）的唯一载体，nuget.org 只从 snupkg 提取 PDB 进符号服务器。
          # 缺了它消费者调试时 F11 进不了库源码，且没有任何错误提示——必须在此硬失败。
          if ! compgen -G "artifacts/*.snupkg" > /dev/null; then
            echo "::error::pack 未生成 snupkg，源码映射将不可用，终止发布"
            exit 1
          fi
          # 双目标：nupkg 里每个 lib/<tfm>/ 都必须有同名 PDB，缺哪个 TFM，哪个 TFM 的消费者就 F11 不进源码。
          LIB_TFMS="$(unzip -l artifacts/*.nupkg | grep -oE 'lib/[^/]+/[^/]+\.dll' | cut -d/ -f2 | sort -u | tr '\n' ' ' || true)"
          PDB_TFMS="$(unzip -l artifacts/*.snupkg | grep -oE 'lib/[^/]+/[^/]+\.pdb' | cut -d/ -f2 | sort -u | tr '\n' ' ' || true)"
          echo "nupkg 资产 TFM: $LIB_TFMS"
          echo "snupkg PDB TFM: $PDB_TFMS"
          if [ -z "$LIB_TFMS" ] || [ "$LIB_TFMS" != "$PDB_TFMS" ]; then
            echo "::error::snupkg 的 PDB 未覆盖 nupkg 的全部资产 TFM，缺失 TFM 的源码映射将不可用，终止发布"
            exit 1
          fi

      - name: 换取 nuget.org 短期 API Key（OIDC 受信发布）
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # nuget.org 用户名（profile name），不是邮箱；已在仓库 Secrets 中配置
          user: ${{ secrets.NUGET_USER }}

      - name: 发布到 nuget.org（幂等：按线上真实状态决定推什么）
        id: publish
        # 每次运行都按「线上真实状态」决定动作，重跑任意次结果一致：已在库的版本不会被推第二次。
        # 为什么不是一个「确认未发布 → 推 → 推符号」的直线流程：
        #   · nuget.org 摄入是异步的。管理端后台（Manage Packages）立刻能看到记录，但公开索引
        #     （flat container / registration / 搜索）要过一段时间，最长约 30 分钟；这段窗口里
        #     flat container 是 404——**404 不等于「没发布」**，直线流程会误判成未发布、
        #     再推一次拿 409 然后失败。
        #   · 反过来，健康的重跑（nupkg 已在库、符号也齐）不该报错，缺符号时应该只补推符号。
        # 所以这里按「先推、用 409 反推真实状态、再核对二进制身份」的幂等状态机走：
        #   new      → 本次发布成功（推了 nupkg；snupkg 按需推）
        #   existing → 版本已在库：先比对线上二进制与本次构建是否同一份，再决定是否补推符号；
        #              索引仍在 30 分钟窗口内取不到时只告警并跳过符号，不判失败
        # 关键判据都放在唯一权威端点上：包是否在库看 flat container，符号是否可用看符号服务器。
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -uo pipefail
          ID="$(basename "$PACKAGE_PROJECT" .csproj)"
          ID_LC="${ID,,}"
          VER="${{ steps.meta.outputs.version }}"
          NUPKG="$(ls artifacts/*.nupkg)"
          SNUPKG="$(ls artifacts/*.snupkg)"
          FLAT="https://api.nuget.org/v3-flatcontainer/${ID_LC}/${VER}/${ID_LC}.${VER}.nupkg"
          SYM="https://symbols.nuget.org/download/symbols/${ID}.pdb"

          # flat container / blob 存储：该端点无条件 302 到 blob，必须跟随重定向看最终码（200/404）
          probe_pkg() { curl -sL -o /dev/null -w '%{http_code}' --max-time 60 "$FLAT"; }
          # 符号服务器只验 SymbolChecksum 头是否存在，缺头一律 403（与符号在否无关）；
          # portable PDB 的 age 掩码固定 FFFFFFFF
          probe_sym() {
            curl -sL -o /dev/null -w '%{http_code}' --max-time 60 \
              -H "SymbolChecksum: SHA256:$1" "${SYM}/$1FFFFFFFF/${ID}.pdb"
          }

          LOCAL_ID="$(python3 .github/scripts/debug-id.py --nupkg "$NUPKG")" || {
            echo "::error::无法从本次构建的 nupkg 提取 PDB debug id，终止发布"
            exit 1
          }
          echo "本次构建：$NUPKG"
          echo "本次构建 PDB debug id：$LOCAL_ID"

          # ── 1. nupkg：先推，用结果反推真实状态 ──────────────────────────────
          STATE=new
          code="$(probe_pkg)"
          echo "flat container 探测：HTTP $code"
          if [ "$code" = "200" ]; then
            echo "版本 $VER 已在公开索引可拉取，本次不再推 nupkg"
            STATE=existing
          else
            echo "推送 $NUPKG …"
            # --no-symbols 不可省：dotnet nuget push 推 nupkg 时会自动把同目录同名的 .snupkg
            # 一并推到源的符号端点（1.0.2 因此把符号包推了两次，第二次 409 把 job 弄红）。
            log="$(dotnet nuget push "$NUPKG" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --no-symbols 2>&1)"
            rc=$?
            echo "$log"
            if [ $rc -ne 0 ]; then
              if ! printf '%s' "$log" | grep -qiE 'conflict|409'; then
                echo "::error::nupkg 推送失败（不是版本冲突），终止发布"
                exit 1
              fi
              echo "推送返回 409：版本已存在（多为此前 job 已推过，或公开索引尚未跟上），转为核对线上二进制"
              STATE=existing
            fi
          fi

          # ── 2. 版本已在库：线上那份二进制是不是本次构建？────────────────────
          # 版本号不可变、先到先得。若线上是另一份构建（1.0.0/1.0.1 就是本地抢先发布），
          # 本次构建的产物永远进不去该版本，补推符号也只会挂上没人会请求的 GUID——那属于
          # 错误操作，必须响亮失败并让人递增版本号，而不是假装补推成功。
          PUSH_SYM=1
          if [ "$STATE" = "existing" ]; then
            # 索引滞后最长约 30 分钟：刚发过的版本在这段窗口里 flat container 仍是 404。
            # 窗口按 30 分钟给（30 × 60s），短窗口会把「刚发完就重跑」判死。
            for i in $(seq 1 30); do
              code="$(probe_pkg)"
              [ "$code" = "200" ] && break
              echo "等待 $VER 在 flat container 可拉取（HTTP $code，$i/30，索引滞后最长约 30 分钟），60s 后重试…"
              sleep 60
            done
            if [ "$code" != "200" ]; then
              # 取不到不等于发错：409 已经证明该版本在库里，只是公开索引还没跟上。
              # 判失败等于惩罚「刚发完就重跑」，所以这里只告警并跳过符号补推，
              # 由 verify-published 事后复核（它只读端点，不受发布窗口影响）。
              echo "::warning::线上已存在 $VER（推送冲突），但 30 分钟内 flat container 始终取不到（HTTP $code）：索引仍在生效，本次跳过符号补推。稍后用 Actions → build-nuget → Run workflow（verify-published）复核。"
              PUSH_SYM=0
            else
              curl -sL --max-time 180 -o /tmp/published.nupkg "$FLAT" || {
                echo "::error::下载已发布的 nupkg 失败"
                exit 1
              }
              REMOTE_ID="$(python3 .github/scripts/debug-id.py --nupkg /tmp/published.nupkg)" || {
                echo "::error::无法从已发布的 nupkg 提取 PDB debug id"
                exit 1
              }
              echo "线上 $VER 的 PDB debug id：$REMOTE_ID"
              if [ "$REMOTE_ID" != "$LOCAL_ID" ]; then
                echo "::error::线上 $VER 的二进制不是本次构建（线上 $REMOTE_ID ≠ 本地 $LOCAL_ID）"
                echo "::error::版本号不可变：本次构建内容无法以该版本号发布，补推符号也对不上。请递增版本号重新发版，并确保发布方唯一（只从 CI 打 tag 发布）。"
                exit 1
              fi
              echo "线上与本次构建是同一份二进制，可安全补推符号"
            fi
          fi

          # ── 3. snupkg：缺才补推；已有副本在排队（409）不算失败 ───────────────
          if [ "$STATE" = "existing" ] && [ "$PUSH_SYM" = "1" ]; then
            sym="$(probe_sym "$LOCAL_ID")"
            echo "符号服务器探测：HTTP $sym"
            if [ "$sym" = "200" ]; then
              echo "符号已就绪，跳过推送（重跑幂等）"
              PUSH_SYM=0
            fi
          fi
          if [ "$PUSH_SYM" = "1" ]; then
            echo "推送 $SNUPKG …"
            log="$(dotnet nuget push "$SNUPKG" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" 2>&1)"
            rc=$?
            echo "$log"
            if [ $rc -ne 0 ]; then
              if ! printf '%s' "$log" | grep -qiE 'conflict|409|pending validation'; then
                echo "::error::符号包推送失败（不是重复冲突），终止发布"
                exit 1
              fi
              # 409 的含义是「已有同名符号包在排队验证」。符号到底可不可用，唯一权威判据是
              # 符号服务器本身（下一步轮询），所以这里不 fail——1.0.2 的假红就是这么来的。
              echo "符号包已有副本在排队验证（409），不视为失败，交由符号服务器校验判定"
            fi
          fi

          {
            echo "debug_id=$LOCAL_ID"
            echo "state=$STATE"
            echo "symbols_pushed=$PUSH_SYM"
          } >> "$GITHUB_OUTPUT"
          echo "发布状态：state=$STATE，symbols_pushed=$PUSH_SYM"

      - name: 观察符号在 nuget.org 符号服务器可见性
        id: symbols
        # 1.0.0 的教训：nupkg 与 snupkg 都「推送成功」、job 全绿，但符号从未到达符号服务器，
        # 消费者调试时无法 F11 进源码。推送端点不回报符号摄入结果，唯一权威判据是符号服务器本身。
        # 但符号摄入比包索引滞后得多（snupkg 验证 → 提取 PDB → 边缘同步），官方口径是数分钟到
        # 数小时：拿一个固定窗口当判据必然误判（1.0.x 的假红就是这么来的）。
        # 所以这里只做「有界观察」——抢到 200 就当场确认，超时如实告警但不判失败，
        # 事后用本文件的 verify-published 手动任务补验。
        env:
          DEBUG_ID: ${{ steps.publish.outputs.debug_id }}
        run: |
          set -uo pipefail
          if [ -z "${DEBUG_ID:-}" ]; then
            echo "::error::发布步骤没有输出 debug_id，无法校验符号"
            exit 1
          fi
          ID="$(basename "$PACKAGE_PROJECT" .csproj)"
          URL="https://symbols.nuget.org/download/symbols/${ID}.pdb/${DEBUG_ID}FFFFFFFF/${ID}.pdb"
          # 20 分钟窗口（40 × 30s）足以覆盖常见摄入耗时，又不至于让 job 白等；
          # 302 探测与实际下载可能不一致，跟随重定向后看最终码，200 即 PDB 可下载
          for i in $(seq 1 40); do
            code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 -H "SymbolChecksum: SHA256:$DEBUG_ID" "$URL")"
            if [ "$code" = "200" ]; then
              echo "符号已就绪，源码映射可用：$URL"
              echo "symbols_visible=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "符号尚不可见（HTTP $code，$i/40），30s 后重试…"
            sleep 30
          done
          echo "symbols_visible=no" >> "$GITHUB_OUTPUT"
          echo "::warning::符号推送后 20 分钟内仍不可见（HTTP $code）。这不是发布失败：符号摄入远比包索引慢，常见 10 分钟到数小时。无需重跑本 job（重跑会走 existing 分支，也不会更快），稍后用 Actions → build-nuget → Run workflow（verify-published）复核：$URL"

      - name: 等待包对客户端可拉取（索引生效滞后是正常的）
        id: visibility
        # nuget.org 的摄入与索引是异步的，这两个阶段要分清：
        #   管理端后台（Manage Packages / 上传记录）—— 提交后立刻可见，说明「已收到」；
        #   公开索引（flat container / registration / 搜索）—— 过一段时间才生效，说明「可消费」。
        # 生效前 `dotnet add package` / restore 会报 NU1101/NU1102，网页也可能 404，这都不是发布失败。
        # 所以这一步只做「如实告知 + 有界等待」，不让索引滞后把已落库的发布判死。
        run: |
          set -uo pipefail
          ID="$(basename "$PACKAGE_PROJECT" .csproj)"
          ID_LC="${ID,,}"
          VER="${{ steps.meta.outputs.version }}"
          FLAT="https://api.nuget.org/v3-flatcontainer/${ID_LC}/${VER}/${ID_LC}.${VER}.nupkg"
          for i in $(seq 1 20); do
            code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 "$FLAT")"
            if [ "$code" = "200" ]; then
              echo "客户端已可拉取：$FLAT"
              echo "ready=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "尚不可拉取（HTTP $code，$i/20），15s 后重试…"
            sleep 15
          done
          echo "ready=no" >> "$GITHUB_OUTPUT"
          echo "::warning::发布已成功，但 ${VER} 在公开索引仍不可拉取（摄入/索引滞后）。这与发布结果无关，通常几分钟到约 30 分钟后自动生效，届时无需重跑；期间下游 restore 报 NU1101 属正常。若长时间不生效，去 nuget.org 管理端核对包状态。"

      - name: 写入运行摘要
        if: always()
        run: |
          ID="$(basename "$PACKAGE_PROJECT" .csproj)"
          {
            echo "### $ID ${{ steps.meta.outputs.version }}"
            echo ""
            echo "- tag: \`${{ github.ref_name }}\`"
            echo "- 预发布: \`${{ steps.meta.outputs.is_prerelease }}\`"
            echo "- 发布前探测: \`${{ steps.preflight.outputs.state }}\`（present=运行开始时已可拉取；missing=当时取不到，可能是首次发布，也可能是索引仍在生效）"
            echo "- 发布状态: \`${{ steps.publish.outputs.state }}\`（new=本次发布，existing=版本已在库）"
            echo "- 符号包本次推送: \`${{ steps.publish.outputs.symbols_pushed }}\`（0=线上已就绪，跳过）"
            echo "- PDB debug id: \`${{ steps.publish.outputs.debug_id }}\`"
            echo "- 客户端可拉取: \`${{ steps.visibility.outputs.ready }}\`（空白=该步未执行；no=索引仍在生效中）"
            echo "- 符号可见: \`${{ steps.symbols.outputs.symbols_visible }}\`（yes=已确认可下载；no=摄入滞后，属正常，稍后用 verify-published 复核）"
            echo "- 包: https://www.nuget.org/packages/$ID/${{ steps.meta.outputs.version }}"
            echo "- 符号: https://symbols.nuget.org/download/symbols/$ID.pdb/ （源码映射载体，可见性见上）"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    name: 复核已发布版本（包可拉取 + 符号可见）
    # 发布时的符号校验只是有界观察，摄入慢于窗口属于常态。事后补验走这里：
    # Actions → build-nuget → Run workflow → 填版本号。不构建、不发布、不动线上，只打两个权威端点。
    # 两包锁步发版：按 matrix 逐包复核（同一版本号）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - src/AxiosNet/AxiosNet.csproj
          - src/AxiosNet.DependencyInjection/AxiosNet.DependencyInjection.csproj
    env:
      DOTNET_NOLOGO: true
      PACKAGE_PROJECT: ${{ matrix.package }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解出要核对的版本
        id: target
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ver="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PACKAGE_PROJECT" | head -1)"
          fi
          if [ -z "$ver" ]; then
            echo "::error::没有版本可核对（输入为空且 csproj 里取不到 <Version>）"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "核对版本：$ver"

      - name: 探测 flat container 与符号服务器
        # 两个端点都是「终态事实」：包能下载 = 可消费，PDB 能下载 = 源码映射可用。
        # 404 一律不判失败——它们只说明摄入还没走完，重跑本流程即可。
        run: |
          set -uo pipefail
          ID="$(basename "$PACKAGE_PROJECT" .csproj)"
          ID_LC="${ID,,}"
          VER="${{ steps.target.outputs.version }}"
          FLAT="https://api.nuget.org/v3-flatcontainer/${ID_LC}/${VER}/${ID_LC}.${VER}.nupkg"

          pkg="$(curl -sL -o /tmp/published.nupkg -w '%{http_code}' --max-time 180 "$FLAT")"
          echo "包（flat container）：HTTP $pkg"
          if [ "$pkg" != "200" ]; then
            {
              echo "### $ID $VER 复核"
              echo ""
              echo "- 包：HTTP \`$pkg\` — 公开索引尚未生效（或该版本不存在）"
              echo "- 符号：未核对（包不可拉取时 debug id 无从取得）"
              echo "- 端点：$FLAT"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$VER 在 flat container 取不到（HTTP $pkg），无法核对符号。索引滞后通常几分钟到数十分钟，稍后重跑本流程。"
            exit 0
          fi

          DEBUG_ID="$(python3 .github/scripts/debug-id.py --nupkg /tmp/published.nupkg)"
          echo "已发布二进制 PDB debug id：$DEBUG_ID"
          SYM_URL="https://symbols.nuget.org/download/symbols/${ID}.pdb/${DEBUG_ID}FFFFFFFF/${ID}.pdb"
          sym=""
          for i in $(seq 1 6); do
            sym="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 -H "SymbolChecksum: SHA256:$DEBUG_ID" "$SYM_URL")"
            [ "$sym" = "200" ] && break
            echo "符号尚不可见（HTTP $sym，$i/6），30s 后重试…"
            sleep 30
          done
          echo "符号：HTTP $sym"

          {
            echo "### $ID $VER 复核"
            echo ""
            echo "- 包：HTTP \`$pkg\`（可拉取）"
            echo "- PDB debug id：\`$DEBUG_ID\`"
            if [ "$sym" = "200" ]; then
              echo "- 符号：HTTP \`$sym\` — 已收录，源码映射可用"
            else
              echo "- 符号：HTTP \`$sym\` — 摄入仍未完成（正常现象），过段时间重跑本流程"
            fi
            echo "- 符号端点：$SYM_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$sym" != "200" ]; then
            echo "::warning::符号仍未收录（HTTP $sym）。这不影响包本身可用，只是暂时无法单步调试进库源码；符号摄入滞后是常态，过段时间重跑本流程即可。"
          fi
