# 打 tag（v1.2.3 / v1.2.3-rc.1）时自动构建、测试、打包并发布到 nuget.org。
# 普通 push / PR 只做构建 + 测试（不发布），避免回归只能等到打 tag 才暴露。
# 认证方式：NuGet Trusted Publishing（OIDC），不需要长期 API Key，也不需要 NUGET_API_KEY 密钥。
#
# 与 nuget.org「Trusted Publishing」策略必须逐项一致（大小写不敏感，但内容要相同）：
#   Repository Owner : sunyuliang        ← 仓库：https://github.com/sunyuliang/AxiosNet
#   Repository       : AxiosNet
#   Workflow File    : build-nuget.yml   ← 只填文件名，不带 .github/workflows/ 路径
#   Environment      : build-nuget
# 任一不匹配，NuGet/login 会拿不到临时 Key（401/403）。

name: build-nuget

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v[0-9]*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      TEST_PROJECT: test/AxiosNet.Tests/AxiosNet.Tests.csproj

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 类库是单目标 net6.0，但测试项目为 net6.0 + net8.0 双目标（验证同一份资产在两种运行时上的行为），
          # 因此 6.0 运行时必须显式安装（runner 镜像不保证保留已 EOL 的 6.0）
          dotnet-version: |
            8.0.x
            6.0.x

      - name: 还原依赖
        run: dotnet restore "$TEST_PROJECT"

      - name: 构建
        run: dotnet build "$TEST_PROJECT" --configuration Release --no-restore

      - name: 运行单元测试
        run: dotnet test "$TEST_PROJECT" --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

  publish:
    name: pack & push
    # 只有 tag 推送才发布；普通 push / PR 由上面的 build-test 覆盖
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 必须与 nuget.org 策略里填的 Environment 完全一致（策略填了就必须匹配）
    environment: build-nuget
    permissions:
      contents: read
      id-token: write # OIDC：换取 nuget.org 短期 API Key 的前提

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      PACKAGE_PROJECT: src/AxiosNet/AxiosNet.csproj
      TEST_PROJECT: test/AxiosNet.Tests/AxiosNet.Tests.csproj

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink 需要完整历史来计算 commit

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: 校验 tag 并解析包版本
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          # 允许 1.2.3 与 1.2.3-rc.1（NuGet 语义化版本，不含 build metadata）
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::tag '$tag' 不符合 vMAJOR.MINOR.PATCH[-prerelease]，例如 v1.0.0 / v1.1.0-rc.1"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [[ "$ver" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "解析出版本：$ver（来自 tag $tag，commit ${GITHUB_SHA:0:7}）"

      - name: 还原依赖
        run: dotnet restore "$TEST_PROJECT"

      - name: 构建
        run: |
          dotnet build "$TEST_PROJECT" \
            --configuration Release \
            --no-restore \
            -p:Version="${{ steps.meta.outputs.version }}" \
            -p:ContinuousIntegrationBuild=true

      - name: 运行单元测试
        run: |
          dotnet test "$TEST_PROJECT" \
            --configuration Release \
            --no-build \
            --no-restore \
            --logger "console;verbosity=normal"

      - name: 打包 nupkg + snupkg
        run: |
          set -euo pipefail
          # 不用 --no-build：由 pack 自己构建。--no-build 打包在某些 SDK/环境组合下可能不生成
          # snupkg，而符号包缺失在推送端毫无报错（1.0.0 实际中招，详见下方可见性校验）。
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --output artifacts \
            -p:Version="${{ steps.meta.outputs.version }}" \
            -p:ContinuousIntegrationBuild=true
          echo '--- artifacts ---'
          ls -l artifacts
          # 符号包是源码映射（SourceLink）的唯一载体，nuget.org 只从 snupkg 提取 PDB 进符号服务器。
          # 缺了它消费者调试时 F11 进不了库源码，且没有任何错误提示——必须在此硬失败。
          if ! compgen -G "artifacts/*.snupkg" > /dev/null; then
            echo "::error::pack 未生成 snupkg，源码映射将不可用，终止发布"
            exit 1
          fi
          if ! unzip -l artifacts/*.snupkg | grep -q '\.pdb$'; then
            echo "::error::snupkg 内未找到 .pdb，符号包内容异常，终止发布"
            exit 1
          fi

      - name: 换取 nuget.org 短期 API Key（OIDC 受信发布）
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # nuget.org 用户名（profile name），不是邮箱；已在仓库 Secrets 中配置
          user: ${{ secrets.NUGET_USER }}

      - name: 发布到 nuget.org（幂等：按线上真实状态决定推什么）
        id: publish
        # 为什么不是一个「确认未发布 → 推 → 推符号」的直线流程：
        #   · nuget.org 摄入是异步的。管理端后台（Manage Packages）立刻能看到记录，但公开索引
        #     （flat container / registration / 搜索）要过一段时间，这段窗口里 flat container 是
        #     404——**404 不等于「没发布」**，直线流程会误判成未发布、再推一次拿 409 然后失败。
        #   · 反过来，健康的重跑（nupkg 已在库、符号也齐）不该报错，缺符号时应该只补推符号。
        # 所以这里按「先推、用 409 反推真实状态、再核对二进制身份」的幂等状态机走：
        #   new      → 本次发布成功（推了 nupkg；snupkg 按需推）
        #   existing → 版本已在库：先比对线上二进制与本次构建是否同一份，再决定是否补推符号
        # 关键判据都放在唯一权威端点上：包是否在库看 flat container，符号是否可用看符号服务器。
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -uo pipefail
          ID="$(basename "$PACKAGE_PROJECT" .csproj)"
          ID_LC="${ID,,}"
          VER="${{ steps.meta.outputs.version }}"
          NUPKG="$(ls artifacts/*.nupkg)"
          SNUPKG="$(ls artifacts/*.snupkg)"
          FLAT="https://api.nuget.org/v3-flatcontainer/${ID_LC}/${VER}/${ID_LC}.${VER}.nupkg"
          SYM="https://symbols.nuget.org/download/symbols/${ID}.pdb"

          # flat container / blob 存储：该端点无条件 302 到 blob，必须跟随重定向看最终码（200/404）
          probe_pkg() { curl -sL -o /dev/null -w '%{http_code}' --max-time 60 "$FLAT"; }
          # 符号服务器只验 SymbolChecksum 头是否存在，缺头一律 403（与符号在否无关）；
          # portable PDB 的 age 掩码固定 FFFFFFFF
          probe_sym() {
            curl -sL -o /dev/null -w '%{http_code}' --max-time 60 \
              -H "SymbolChecksum: SHA256:$1" "${SYM}/$1FFFFFFFF/${ID}.pdb"
          }

          LOCAL_ID="$(python3 .github/scripts/debug-id.py --nupkg "$NUPKG")" || {
            echo "::error::无法从本次构建的 nupkg 提取 PDB debug id，终止发布"
            exit 1
          }
          echo "本次构建：$NUPKG"
          echo "本次构建 PDB debug id：$LOCAL_ID"

          # ── 1. nupkg：先推，用结果反推真实状态 ──────────────────────────────
          STATE=new
          code="$(probe_pkg)"
          echo "flat container 探测：HTTP $code"
          if [ "$code" = "200" ]; then
            echo "版本 $VER 已在公开索引可拉取，本次不再推 nupkg"
            STATE=existing
          else
            echo "推送 $NUPKG …"
            # --no-symbols 不可省：dotnet nuget push 推 nupkg 时会自动把同目录同名的 .snupkg
            # 一并推到源的符号端点（1.0.2 因此把符号包推了两次，第二次 409 把 job 弄红）。
            log="$(dotnet nuget push "$NUPKG" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --no-symbols 2>&1)"
            rc=$?
            echo "$log"
            if [ $rc -ne 0 ]; then
              if ! printf '%s' "$log" | grep -qiE 'conflict|409'; then
                echo "::error::nupkg 推送失败（不是版本冲突），终止发布"
                exit 1
              fi
              echo "推送返回 409：版本已存在（多为此前 job 已推过，或公开索引尚未跟上），转为核对线上二进制"
              STATE=existing
            fi
          fi

          # ── 2. 版本已在库：线上那份二进制是不是本次构建？────────────────────
          # 版本号不可变、先到先得。若线上是另一份构建（1.0.0/1.0.1 就是本地抢先发布），
          # 本次构建的产物永远进不去该版本，补推符号也只会挂上没人会请求的 GUID——那属于
          # 错误操作，必须响亮失败并让人递增版本号，而不是假装补推成功。
          if [ "$STATE" = "existing" ]; then
            for i in $(seq 1 18); do
              code="$(probe_pkg)"
              [ "$code" = "200" ] && break
              echo "等待 $VER 在 flat container 可拉取（HTTP $code，$i/18），10s 后重试…"
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error::线上已存在 $VER（推送冲突），但 flat container 始终取不到（HTTP $code），无法核对二进制身份，本次不补推符号"
              exit 1
            fi
            curl -sL --max-time 180 -o /tmp/published.nupkg "$FLAT" || {
              echo "::error::下载已发布的 nupkg 失败"
              exit 1
            }
            REMOTE_ID="$(python3 .github/scripts/debug-id.py --nupkg /tmp/published.nupkg)" || {
              echo "::error::无法从已发布的 nupkg 提取 PDB debug id"
              exit 1
            }
            echo "线上 $VER 的 PDB debug id：$REMOTE_ID"
            if [ "$REMOTE_ID" != "$LOCAL_ID" ]; then
              echo "::error::线上 $VER 的二进制不是本次构建（线上 $REMOTE_ID ≠ 本地 $LOCAL_ID）"
              echo "::error::版本号不可变：本次构建内容无法以该版本号发布，补推符号也对不上。请递增版本号重新发版，并确保发布方唯一（只从 CI 打 tag 发布）。"
              exit 1
            fi
            echo "线上与本次构建是同一份二进制，可安全补推符号"
          fi

          # ── 3. snupkg：缺才补推；已有副本在排队（409）不算失败 ───────────────
          PUSH_SYM=1
          if [ "$STATE" = "existing" ]; then
            sym="$(probe_sym "$LOCAL_ID")"
            echo "符号服务器探测：HTTP $sym"
            if [ "$sym" = "200" ]; then
              echo "符号已就绪，跳过推送（重跑幂等）"
              PUSH_SYM=0
            fi
          fi
          if [ "$PUSH_SYM" = "1" ]; then
            echo "推送 $SNUPKG …"
            log="$(dotnet nuget push "$SNUPKG" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" 2>&1)"
            rc=$?
            echo "$log"
            if [ $rc -ne 0 ]; then
              if ! printf '%s' "$log" | grep -qiE 'conflict|409|pending validation'; then
                echo "::error::符号包推送失败（不是重复冲突），终止发布"
                exit 1
              fi
              # 409 的含义是「已有同名符号包在排队验证」。符号到底可不可用，唯一权威判据是
              # 符号服务器本身（下一步轮询），所以这里不 fail——1.0.2 的假红就是这么来的。
              echo "符号包已有副本在排队验证（409），不视为失败，交由符号服务器校验判定"
            fi
          fi

          {
            echo "debug_id=$LOCAL_ID"
            echo "state=$STATE"
            echo "symbols_pushed=$PUSH_SYM"
          } >> "$GITHUB_OUTPUT"
          echo "发布状态：state=$STATE，symbols_pushed=$PUSH_SYM"

      - name: 校验符号已在 nuget.org 符号服务器可见
        # 1.0.0 的教训：nupkg 与 snupkg 都「推送成功」、job 全绿，但符号从未到达符号服务器，
        # 消费者调试时无法 F11 进源码。推送端点不回报符号摄入结果，唯一权威判据是符号服务器本身。
        # debug id 直接取上一步核对过的值（那是「线上二进制」的 id，比重新从本地 DLL 算更权威）。
        env:
          DEBUG_ID: ${{ steps.publish.outputs.debug_id }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_ID:-}" ]; then
            echo "::error::发布步骤没有输出 debug_id，无法校验符号"
            exit 1
          fi
          ID="$(basename "$PACKAGE_PROJECT" .csproj)"
          URL="https://symbols.nuget.org/download/symbols/${ID}.pdb/${DEBUG_ID}FFFFFFFF/${ID}.pdb"
          # 符号摄入有秒级~分钟级延迟，且 symbols.nuget.org 边缘节点有抖动（302 探测与实际下载
          # 可能不一致），轮询至多 10 分钟、以实际下载为准；302=已收录，200=直连
          for i in $(seq 1 60); do
            code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 -H "SymbolChecksum: SHA256:$DEBUG_ID" "$URL")"
            if [ "$code" = "200" ]; then
              echo "符号已就绪，源码映射可用：$URL"
              exit 0
            fi
            echo "符号尚不可见（HTTP $code，$i/60），10s 后重试…"
            sleep 10
          done
          echo "::error::符号推送后 10 分钟仍不可见，源码映射不会生效：$URL"
          exit 1

      - name: 等待包对客户端可拉取（索引生效滞后是正常的）
        id: visibility
        # nuget.org 的摄入与索引是异步的，这两个阶段要分清：
        #   管理端后台（Manage Packages / 上传记录）—— 提交后立刻可见，说明「已收到」；
        #   公开索引（flat container / registration / 搜索）—— 过一段时间才生效，说明「可消费」。
        # 生效前 `dotnet add package` / restore 会报 NU1101/NU1102，网页也可能 404，这都不是发布失败。
        # 所以这一步只做「如实告知 + 有界等待」，不让索引滞后把已落库的发布判死。
        run: |
          set -uo pipefail
          ID="$(basename "$PACKAGE_PROJECT" .csproj)"
          ID_LC="${ID,,}"
          VER="${{ steps.meta.outputs.version }}"
          FLAT="https://api.nuget.org/v3-flatcontainer/${ID_LC}/${VER}/${ID_LC}.${VER}.nupkg"
          for i in $(seq 1 20); do
            code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 "$FLAT")"
            if [ "$code" = "200" ]; then
              echo "客户端已可拉取：$FLAT"
              echo "ready=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "尚不可拉取（HTTP $code，$i/20），15s 后重试…"
            sleep 15
          done
          echo "ready=no" >> "$GITHUB_OUTPUT"
          echo "::warning::发布已成功，但 ${VER} 在公开索引仍不可拉取（摄入/索引滞后）。这与发布结果无关，通常几分钟~数十分钟后自动生效，届时无需重跑；期间下游 restore 报 NU1101 属正常。若长时间不生效，去 nuget.org 管理端核对包状态。"

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo "### AxiosNet ${{ steps.meta.outputs.version }}"
            echo ""
            echo "- tag: \`${{ github.ref_name }}\`"
            echo "- 预发布: \`${{ steps.meta.outputs.is_prerelease }}\`"
            echo "- 发布状态: \`${{ steps.publish.outputs.state }}\`（new=本次发布，existing=版本已在库）"
            echo "- 符号包本次推送: \`${{ steps.publish.outputs.symbols_pushed }}\`（0=线上已就绪，跳过）"
            echo "- PDB debug id: \`${{ steps.publish.outputs.debug_id }}\`"
            echo "- 客户端可拉取: \`${{ steps.visibility.outputs.ready }}\`（空白=该步未执行；no=索引仍在生效中）"
            echo "- 包: https://www.nuget.org/packages/AxiosNet/${{ steps.meta.outputs.version }}"
            echo "- 符号: https://symbols.nuget.org/download/symbols/AxiosNet.pdb/ （源码映射载体，已由上方步骤校验）"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
