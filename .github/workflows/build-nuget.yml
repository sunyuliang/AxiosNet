# 打 tag（v1.2.3 / v1.2.3-rc.1）时自动构建、测试、打包并发布到 nuget.org。
# 普通 push / PR 只做构建 + 测试（不发布），避免回归只能等到打 tag 才暴露。
# 认证方式：NuGet Trusted Publishing（OIDC），不需要长期 API Key，也不需要 NUGET_API_KEY 密钥。
#
# 与 nuget.org「Trusted Publishing」策略必须逐项一致（大小写不敏感，但内容要相同）：
#   Repository Owner : sunyuliang        ← 仓库：https://github.com/sunyuliang/AxiosNet
#   Repository       : AxiosNet
#   Workflow File    : build-nuget.yml   ← 只填文件名，不带 .github/workflows/ 路径
#   Environment      : build-nuget
# 任一不匹配，NuGet/login 会拿不到临时 Key（401/403）。

name: build-nuget

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v[0-9]*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      TEST_PROJECT: test/AxiosNet.Tests/AxiosNet.Tests.csproj

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 类库是单目标 net6.0，但测试项目为 net6.0 + net8.0 双目标（验证同一份资产在两种运行时上的行为），
          # 因此 6.0 运行时必须显式安装（runner 镜像不保证保留已 EOL 的 6.0）
          dotnet-version: |
            8.0.x
            6.0.x

      - name: 还原依赖
        run: dotnet restore "$TEST_PROJECT"

      - name: 构建
        run: dotnet build "$TEST_PROJECT" --configuration Release --no-restore

      - name: 运行单元测试
        run: dotnet test "$TEST_PROJECT" --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

  publish:
    name: pack & push
    # 只有 tag 推送才发布；普通 push / PR 由上面的 build-test 覆盖
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 必须与 nuget.org 策略里填的 Environment 完全一致（策略填了就必须匹配）
    environment: build-nuget
    permissions:
      contents: read
      id-token: write # OIDC：换取 nuget.org 短期 API Key 的前提

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      PACKAGE_PROJECT: src/AxiosNet/AxiosNet.csproj
      TEST_PROJECT: test/AxiosNet.Tests/AxiosNet.Tests.csproj

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink 需要完整历史来计算 commit

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: 校验 tag 并解析包版本
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          # 允许 1.2.3 与 1.2.3-rc.1（NuGet 语义化版本，不含 build metadata）
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::tag '$tag' 不符合 vMAJOR.MINOR.PATCH[-prerelease]，例如 v1.0.0 / v1.1.0-rc.1"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [[ "$ver" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "解析出版本：$ver（来自 tag $tag，commit ${GITHUB_SHA:0:7}）"

      - name: 还原依赖
        run: dotnet restore "$TEST_PROJECT"

      - name: 构建
        run: |
          dotnet build "$TEST_PROJECT" \
            --configuration Release \
            --no-restore \
            -p:Version="${{ steps.meta.outputs.version }}" \
            -p:ContinuousIntegrationBuild=true

      - name: 运行单元测试
        run: |
          dotnet test "$TEST_PROJECT" \
            --configuration Release \
            --no-build \
            --no-restore \
            --logger "console;verbosity=normal"

      - name: 打包 nupkg + snupkg
        run: |
          set -euo pipefail
          # 不用 --no-build：由 pack 自己构建。--no-build 打包在某些 SDK/环境组合下可能不生成
          # snupkg，而符号包缺失在推送端毫无报错（1.0.0 实际中招，详见下方可见性校验）。
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --output artifacts \
            -p:Version="${{ steps.meta.outputs.version }}" \
            -p:ContinuousIntegrationBuild=true
          echo '--- artifacts ---'
          ls -l artifacts
          # 符号包是源码映射（SourceLink）的唯一载体，nuget.org 只从 snupkg 提取 PDB 进符号服务器。
          # 缺了它消费者调试时 F11 进不了库源码，且没有任何错误提示——必须在此硬失败。
          if ! compgen -G "artifacts/*.snupkg" > /dev/null; then
            echo "::error::pack 未生成 snupkg，源码映射将不可用，终止发布"
            exit 1
          fi
          if ! unzip -l artifacts/*.snupkg | grep -q '\.pdb$'; then
            echo "::error::snupkg 内未找到 .pdb，符号包内容异常，终止发布"
            exit 1
          fi

      - name: 确认版本尚未发布
        # 1.0.0/1.0.1 的教训：本地 dotnet nuget push 与 CI 赛跑，本地版抢先落库后
        # CI 推送全 409 却被 --skip-duplicate 吞掉，随后符号校验拿着 CI 自己构建的
        # PDB GUID 去查符号服务器，永远 404，表象极其迷惑。NuGet 版本不可变、先到
        # 先得，双发布方并存时每次发版都会复现——发布前先硬校验，把竞争变成显式失败。
        run: |
          set -euo pipefail
          ID="$(basename "$PACKAGE_PROJECT" .csproj)"
          VER="${{ steps.meta.outputs.version }}"
          URL="https://api.nuget.org/v3-flatcontainer/${ID,,}/${VER}/${ID,,}.${VER}.nupkg"
          # flat container 地址要求全小写包 id；该端点无条件 302 重定向到 blob 存储，
          # 必须跟随重定向后按最终状态码判定：200=已存在，404=不存在
          code="$(curl -sL -o /dev/null -w '%{http_code}' "$URL")"
          if [ "$code" = "200" ]; then
            echo "::error::AxiosNet ${VER} 已存在于 nuget.org，CI 拒绝发布。"
            echo "::error::多半是本地 dotnet nuget push 抢先落库（版本不可变、先到先得）。发布方必须唯一：请只从 CI 打 tag 发布，不要本地 push。"
            echo "::error::若这是对推送已成功过的 job 的重跑，属预期保护：nupkg 已落库，只需人工补推/核查 snupkg，或递增版本号重新发版。"
            exit 1
          fi
          echo "版本 ${VER} 未被发布（HTTP $code），可以继续"

      - name: 换取 nuget.org 短期 API Key（OIDC 受信发布）
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # nuget.org 用户名（profile name），不是邮箱；已在仓库 Secrets 中配置
          user: ${{ secrets.NUGET_USER }}

      - name: 推送到 nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # 包 + 符号包都用同一把临时 Key（有效期 1 小时）。
          # 故意不用 --skip-duplicate：版本冲突必须响亮失败（上方已有发布前校验兜底），
          # 静默跳过会让 CI 以为发布成功、符号校验却查一个从未上过的 GUID（1.0.1 事故）。
          dotnet nuget push "artifacts/*.nupkg" \
            --source "$NUGET_SOURCE" \
            --api-key "$NUGET_API_KEY"
          dotnet nuget push "artifacts/*.snupkg" \
            --source "$NUGET_SOURCE" \
            --api-key "$NUGET_API_KEY"

      - name: 校验符号已在 nuget.org 符号服务器可见
        # 1.0.0 的教训：nupkg 与 snupkg 都「推送成功」、job 全绿，但符号从未到达符号服务器，
        # 消费者调试时无法 F11 进源码。推送端点不回报符号摄入结果，唯一权威判据是符号服务器本身。
        run: |
          set -euo pipefail
          # PDB debug id 必须从 nupkg 内实际发布的 DLL 提取（消费者调试器正是按这个 DLL 里的
          # CodeView 记录请求符号），并按 PE 调试目录解析，不做裸字节搜索。
          NUPKG="$(ls artifacts/*.nupkg)"
          DEBUG_ID="$(python3 - "$NUPKG" <<'PYEOF'
          import struct, sys, uuid, zipfile
          dll = zipfile.ZipFile(sys.argv[1]).read('lib/net6.0/AxiosNet.dll')
          e_lfanew = struct.unpack_from('<I', dll, 0x3C)[0]
          coff = e_lfanew + 4
          num_sections = struct.unpack_from('<H', dll, coff + 2)[0]
          opt_size = struct.unpack_from('<H', dll, coff + 16)[0]
          opt = coff + 20
          magic = struct.unpack_from('<H', dll, opt)[0]
          dd = opt + (96 if magic == 0x10B else 112) + 6 * 8  # Debug = 数据目录第 6 项
          rva, size = struct.unpack_from('<II', dll, dd)
          sec_table = opt + opt_size
          foff = None
          for k in range(num_sections):
              _, vsize, vaddr, _, roff = struct.unpack_from('<8sIIIIIIHHI', dll, sec_table + k * 40)[:5]
              if vaddr <= rva < vaddr + vsize:
                  foff = roff + (rva - vaddr)
                  break
          if not size or foff is None:
              sys.exit('PE 调试目录缺失或 RVA 转换失败')
          for k in range(size // 28):
              _, _, _, _, ttype, sz, _, ptr = struct.unpack_from('<IIHHIIII', dll, foff + k * 28)
              if ttype == 2:  # CODEVIEW
                  cv = dll[ptr:ptr + sz]
                  print(uuid.UUID(bytes_le=cv[4:20]).hex.upper())
                  break
          else:
              sys.exit('调试目录中无 CodeView 项')
          PYEOF
          )"
          echo "PDB debug id（来自 nupkg 内 DLL）: $DEBUG_ID"
          # portable PDB 查符号服务器时 age 掩码为 FFFFFFFF（只取 32 位 GUID）；SymbolChecksum 头必须带
          # （符号服务器只验该头存在性，缺头一律 403，与符号是否存在无关）
          URL="https://symbols.nuget.org/download/symbols/AxiosNet.pdb/${DEBUG_ID}FFFFFFFF/AxiosNet.pdb"
          # 符号摄入有秒级~分钟级延迟，且 symbols.nuget.org 边缘节点有抖动（302 探测与实际下载
          # 可能不一致），轮询至多 10 分钟、以实际下载为准；302=已收录，200=直连
          for i in $(seq 1 60); do
            code="$(curl -sL -o /dev/null -w '%{http_code}' -H "SymbolChecksum: SHA256:$DEBUG_ID" "$URL")"
            if [ "$code" = "200" ]; then
              echo "符号已就绪，源码映射可用：$URL"
              exit 0
            fi
            echo "符号尚不可见（HTTP $code，$i/60），10s 后重试…"
            sleep 10
          done
          echo "::error::符号推送后 10 分钟仍不可见，源码映射不会生效：$URL"
          exit 1

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo "### AxiosNet ${{ steps.meta.outputs.version }}"
            echo ""
            echo "- tag: \`${{ github.ref_name }}\`"
            echo "- 预发布: \`${{ steps.meta.outputs.is_prerelease }}\`"
            echo "- 包: https://www.nuget.org/packages/AxiosNet/${{ steps.meta.outputs.version }}"
            echo "- 符号: https://symbols.nuget.org/download/symbols/AxiosNet.pdb/ （源码映射载体，已由上方步骤校验）"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
